# 生产/自托管配置模板。不要在这里写账号 ID、D1/KV ID 或真实邮箱。
# 复制为 wrangler.production.toml 并填入自己的值；该文件已被 .gitignore 忽略。
name = "otsmail"
account_id = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "otsmail"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "kv"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "r2"
bucket_name = "otsmail-r2"

[ai]
binding = "ai"

[triggers]
crons = ["*/5 * * * *"]

[vars]
domain = ["example.com"]
admin = "admin@example.com"
CF_ACCOUNT_ID = ""
GMAIL_ROUTING_INBOX = "gmail@example.com"
VAPID_SUBJECT = "mailto:admin@example.com"
# VAPID_PUBLIC_KEY 在 Cloudflare 后台变量中填写自己的公钥；私钥用 secret。
github_switch = false
google_switch = false
mcp_switch = false

[[durable_objects.bindings]]
name = "EMAIL_HUB"
class_name = "EmailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EmailHub"]