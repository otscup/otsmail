name = "otsmail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[observability]
enabled = true

[dev]
ip = "0.0.0.0"

[[d1_databases]]
binding = "db"
database_name = "otsmail-dev"
database_id = "00000000-0000-0000-0000-000000000001"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000001"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "otsmail-dev-r2"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"


[vars]
ai_model = ""
analysis_cache = false
orm_log = false
domain = ["example.com"]
admin = "admin@example.com"
jwt_secret = "dev-only-change-me"

